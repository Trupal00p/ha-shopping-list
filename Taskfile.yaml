version: '3'

env:
  ADB_SERVER_SOCKET: tcp:$(cat /etc/resolv.conf | awk '/nameserver/ {print $2}'):5037

tasks:
  proxy:
    dotenv: ['.env.local']
    cmds:
      - node_modules/.bin/nodemon dev-api-proxy.js

  apk:
    cmds:
      - eas build --platform android --profile preview --local
  
  devbuild:
    cmds:
      - eas build --platform android --local --profile development --output ha-shopping.apk
  
  # Installs the newest APK; eas names local builds build-<timestamp>.apk
  install:
    cmds:
      - adb install "$(ls -t *.apk | head -n 1)"

  devices:
    cmds:
    - adb devices
  
  start_proxy:
    cmds:
      - npm run proxy
    
  start_dev:
    cmds:
      - npm start
  

  browser:
    cmds:
      - task:start_proxy
      - task:start_dev